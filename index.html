<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>23-25 Clark Finances</title>
<style>
/* same house colors as the page: tan clapboard, white trim, cedar stairs */
:root { color-scheme: light; --page: #f1ebdf; --card: #fffdf8; --ink: #23211d; --ink-2: #5c564c;
  --ring: rgba(70,55,30,0.16); --accent: #a4532f; --bad: #b3261e;
  --siding: #e6dcc8; --siding-line: rgba(110,88,55,0.13); }
@media (prefers-color-scheme: dark) {
  :root { color-scheme: dark; --page: #17181a; --card: #212225; --ink: #efe9de; --ink-2: #c8c0b3;
    --ring: rgba(255,240,215,0.14); --accent: #c46a42; --bad: #e66767;
    --siding: #1d1e21; --siding-line: rgba(255,235,200,0.04); }
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: var(--ink);
  background: repeating-linear-gradient(to bottom, transparent 0 11px, var(--siding-line) 11px 12px), var(--siding);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; }
form { width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--ring); border-radius: 14px;
  padding: 24px; border-bottom: 4px solid var(--accent); }
h1 { font-size: 1.35rem; margin: 0 0 4px; font-family: ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; font-weight: 600; }
p { margin: 0 0 16px; color: var(--ink-2); }
label { display: block; font-size: .9rem; margin-bottom: 6px; }
input[type=password] { width: 100%; font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--ring);
  background: var(--page); color: var(--ink); }
.row { display: flex; align-items: center; gap: 8px; margin: 12px 0 16px; font-size: .9rem; color: var(--ink-2); }
button { width: 100%; font: inherit; font-weight: 600; padding: 10px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
#msg { min-height: 1.5em; margin: 10px 0 0; font-size: .9rem; }
#msg.bad { color: var(--bad); }
</style>
</head>
<body>
<form id="lock" hidden>
  <h1>23-25 Clark Condominium</h1>
  <p>Association finances, for the owners.</p>
  <label for="pw">Password</label>
  <input id="pw" type="password" autocomplete="current-password" required autofocus>
  <div class="row"><input id="remember" type="checkbox" checked><label for="remember" style="margin:0">Remember on this device</label></div>
  <button type="submit">Open</button>
  <p id="msg" role="status"></p>
</form>

  const STORE = "clark-finances-key";
  const store = {
    get() { try { return localStorage.getItem(STORE); } catch (e) { return null; } },
    set(v) { try { localStorage.setItem(STORE, v); } catch (e) {} },
    clear() { try { localStorage.removeItem(STORE); } catch (e) {} },
  };
  const $ = (id) => document.getElementById(id);
  const bytes = Uint8Array.from(atob(BLOB), (c) => c.charCodeAt(0));

  async function deriveKey(password) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", salt: SALT, iterations: ITERATIONS, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
  }
  async function open(key) {
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes.slice(0, 12) }, key, bytes.slice(12));
    return new TextDecoder().decode(plain);
  }
  async function show(html) {
    // swap pages only once the lock screen has finished loading, or the browser
    // writes the page into the lock screen instead of replacing it
    if (document.readyState !== "complete") await new Promise((r) => window.addEventListener("load", r, { once: true }));
    window.__CLARK_FORGET__ = function () { store.clear(); location.reload(); };
    document.open(); document.write(html); document.close();
  }

  $("lock").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = $("msg");
    msg.className = ""; msg.textContent = "Checking…";
    try {
      const key = await deriveKey($("pw").value);
      let html;
      try { html = await open(key); } catch (err) {
        msg.className = "bad"; msg.textContent = "That password didn't work. Check with Paul.";
        return;
      }
      if ($("remember").checked) {
        const raw = new Uint8Array(await crypto.subtle.exportKey("raw", key));
        store.set(btoa(String.fromCharCode.apply(null, raw)));
      } else {
        store.clear();
      }
      await show(html);
    } catch (err) {
      msg.className = "bad"; msg.textContent = "This browser can't open the page. Try an up-to-date Safari, Chrome or Edge.";
    }
  });

  (async function () {
    const saved = store.get();
    if (saved) {
      try {
        const key = await crypto.subtle.importKey("raw", Uint8Array.from(atob(saved), (c) => c.charCodeAt(0)),
          "AES-GCM", false, ["decrypt"]);
        const html = await open(key);
        await show(html);
        return;
      } catch (e) { store.clear(); } // password changed since: ask again
    }
    $("lock").hidden = false;
    $("pw").focus();
  })();
})();
